name: Validate image-to-code skill
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install -r requirements-advanced.txt
      - name: Validate example spec
        run: python scripts/validate_spec.py examples/design-spec.example.json
      - name: Verify multi-agent installer syntax
        run: python -m py_compile scripts/install.py
      - name: Run synthetic tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/ci-python.log
      - name: Negative controls, agent probe and evidence coverage
        run: |
          python scripts/negative_controls.py --out artifacts/negative-controls.json
          python scripts/probe_agents.py --out artifacts/agent-probe.json
          python scripts/benchmark_evidence.py --manifest examples/benchmark-coverage.example.json --out artifacts/benchmark-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-qa-metadata
          retention-days: 14
          path: |
            artifacts/negative-controls.json
            artifacts/agent-probe.json
            artifacts/benchmark-coverage.json
      - name: Syntax-check Python scripts
        run: python -m compileall -q scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser capture CLI (dependency-free)
        run: |
          set -o pipefail
          node --test tests/test_capture.mjs tests/test_visual_states.mjs 2>&1 | tee artifacts/ci-node.log
      - name: Collect Python/JS counters
        if: always()
        run: |
          cat artifacts/ci-python.log artifacts/ci-node.log > artifacts/ci-all.log || true
          python scripts/ci_metrics.py collect --job tests --log artifacts/ci-all.log --out artifacts/qa-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-metrics-tests
          path: artifacts/qa-metrics.json
          retention-days: 45
      - name: Syntax-check capture engine
        run: node --check scripts/capture.mjs && node --check scripts/validate_visual_states.mjs
  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture valid and broken pages in a real browser
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory tests/fixtures >/tmp/image-to-code-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture.mjs --url http://127.0.0.1:4173/ --out artifacts/browser-positive --reference-viewport 1179x616 --smoke-widths 360
          if node scripts/capture.mjs --url http://127.0.0.1:4173/broken.html --out artifacts/browser-negative; then
            echo 'FAIL: missing image was incorrectly accepted'
            exit 1
          fi
          node tests/validate_browser_evidence.mjs artifacts/browser-positive/capture-report.json artifacts/browser-negative/capture-report.json
          node scripts/validate_visual_states.mjs tests/fixtures/visual-states.config.json
          if node scripts/validate_visual_states.mjs tests/fixtures/clipped.config.json; then
            echo 'FAIL: clipped phone was incorrectly accepted'
            exit 1
          fi
          node tests/validate_browser_states.mjs artifacts/browser-states/visual-states-report.json artifacts/browser-clipped/visual-states-report.json
      - name: Record verified browser gate counters
        run: python scripts/ci_metrics.py record --job browser-integration --browser-tests 4 --browser-passed 4 --negative-controls 2 --negative-passed 2 --out artifacts/qa-metrics-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-metrics-browser
          path: artifacts/qa-metrics-browser.json
          retention-days: 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-integration-evidence
          path: artifacts/browser-*/


  browser-advanced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser audit dependencies
        run: |
          python -m pip install -r requirements-advanced.txt 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Real mobile touch, focus and font audit
        run: |
          python scripts/browser_compat_qa.py --config examples/browser-compat-fixture.json --out artifacts/mobile-compat.json
          python scripts/browser_font_audit.py --config examples/font-audit-fixture.json --out artifacts/browser-font-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-font-qa-metadata
          retention-days: 14
          path: |
            artifacts/mobile-compat.json
            artifacts/browser-font-audit.json
