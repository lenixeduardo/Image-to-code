name: Validate image-to-code skill
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install -r requirements.txt
      - name: Validate example spec
        run: python scripts/validate_spec.py examples/design-spec.example.json
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Syntax-check Python scripts
        run: python -m compileall -q scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser capture CLI (dependency-free)
        run: node --test tests/test_capture.mjs
      - name: Syntax-check capture engine
        run: node --check scripts/capture.mjs
