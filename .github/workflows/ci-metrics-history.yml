name: Aggregate Image to Code QA history
on:
  workflow_run:
    workflows: ["Validate image-to-code skill"]
    types: [completed]
  schedule:
    - cron: '35 8 * * 1'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read CI history without uploading sources or screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci_metrics.py aggregate --repo "$TARGET_REPOSITORY" --limit 40 --out artifacts/qa-history
      - uses: actions/upload-artifact@v4
        with:
          name: image-to-code-qa-history
          path: artifacts/qa-history/
          retention-days: 45